{% extends "base.html" %}

{% block content %}
<div class="auth-wrapper">
    <div class="auth-card glass-container">
        <div class="auth-logo">
            <i class="fa-solid fa-shield-halved"></i>
        </div>
        <h2>Secure Shield</h2>
        <p class="subtitle">Message Encryption & Decryption Platform</p>
        
        {% if error %}
        <div class="alert alert-danger">
            <i class="fa-solid fa-circle-exclamation"></i>
            {{ error }}
        </div>
        {% endif %}
        
        {% if success %}
        <div class="alert alert-success">
            <i class="fa-solid fa-circle-check"></i>
            {{ success }}
        </div>
        {% endif %}
        
        <form action="{{ url_for('login') }}" method="POST" id="loginForm">
            <div class="form-group">
                <label for="username">Username</label>
                <div class="input-wrapper">
                    <input type="text" id="username" name="username" class="form-input" placeholder="Enter username" required autocomplete="username">
                    <i class="fa-solid fa-user"></i>
                </div>
            </div>
            
            <div class="form-group">
                <label for="password">Password</label>
                <div class="input-wrapper">
                    <input type="password" id="password" name="password" class="form-input" placeholder="Enter password" required autocomplete="current-password">
                    <i class="fa-solid fa-lock"></i>
                    <button type="button" class="toggle-password" onclick="togglePasswordVisibility('password')">
                        <i class="fa-solid fa-eye" id="password-eye"></i>
                    </button>
                </div>
            </div>
            
            <div style="display: flex; gap: 10px; margin-top: 12px;">
                <button type="submit" class="btn btn-primary" style="flex: 1;">
                    <i class="fa-solid fa-right-to-bracket"></i> Sign In
                </button>
                <a href="{{ url_for('guest') }}" class="btn btn-secondary" style="flex: 1; display: inline-flex; align-items: center; justify-content: center; text-decoration: none; background: rgba(99, 102, 241, 0.2); border: 1px solid rgba(99, 102, 241, 0.4);" title="Skip login and encrypt immediately">
                    <i class="fa-solid fa-bolt" style="margin-right: 6px;"></i> Guest Access
                </a>
            </div>
        </form>
        
        <div style="margin-top: 15px; text-align: center;">
            <button type="button" onclick="fillDemo()" style="background: rgba(255, 255, 255, 0.05); border: 1px solid var(--glass-border); color: var(--text-secondary); font-size: 13px; padding: 7px 12px; border-radius: var(--radius-sm); cursor: pointer;">
                <i class="fa-solid fa-user-shield" style="color: var(--color-accent-1); margin-right: 5px;"></i> Use Demo Account (admin / admin123)
            </button>
        </div>
        
        <div class="auth-links" style="margin-top: 16px;">
            Don't have an account? <a href="{{ url_for('register') }}">Create one here</a>
        </div>
    </div>
</div>
{% endblock %}

{% block scripts %}
<script>
    function togglePasswordVisibility(fieldId) {
        const input = document.getElementById(fieldId);
        const eye = document.getElementById(fieldId + '-eye');
        if (input.type === 'password') {
            input.type = 'text';
            eye.classList.remove('fa-eye');
            eye.classList.add('fa-eye-slash');
        } else {
            input.type = 'password';
            eye.classList.remove('fa-eye-slash');
            eye.classList.add('fa-eye');
        }
    function fillDemo() {
        document.getElementById('username').value = 'admin';
        document.getElementById('password').value = 'admin123';
        document.getElementById('loginForm').submit();
    }
</script>
{% endblock %}
